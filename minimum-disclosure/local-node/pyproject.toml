[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-node"
version = "0.1.0"
description = "Conformity assessment where the technical file never leaves the manufacturer's machine"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["flwr[simulation]>=1.35.0,<2.0"]

[tool.hatch.build.targets.wheel]
packages = ["local_node"]

[tool.flwr.app]
publisher = "alpozaydin"
display-name = "Local Node Conformity"
flwr-version-target = "1.35.0"
fab-include = ["local_node/**/*.py", "local_node/fixtures/*.json"]

[tool.flwr.app.config]
rulebook = "uk"

[tool.flwr.app.components]
serverapp = "local_node.server_app:app"
clientapp = "local_node.client_app:app"
